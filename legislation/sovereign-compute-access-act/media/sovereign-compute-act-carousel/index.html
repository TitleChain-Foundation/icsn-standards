<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e7">
  <title>Sovereign Compute Access Act Carousel</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e7;
      --ink: #1d1526;
      --muted: #655d6c;
      --line: #d8d0c4;
      --accent: #9b2b65;
      --control: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Trebuchet MS", sans-serif;
      letter-spacing: 0;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 18px 20px 22px;
    }

    header,
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(1.15rem, 3vw, 1.65rem);
      font-weight: 500;
    }

    .count {
      color: var(--muted);
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .card {
      display: block;
      width: 100%;
      max-width: calc((100vh - 138px) * 0.8);
      height: auto;
      max-height: calc(100vh - 138px);
      aspect-ratio: 4 / 5;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 16px 48px rgba(29, 21, 38, 0.14);
    }

    button,
    .download {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--control);
      color: var(--ink);
      font: inherit;
    }

    button {
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 1.55rem;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible,
    .download:hover,
    .download:focus-visible {
      border-color: var(--accent);
      outline: 2px solid transparent;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      flex: 1;
      min-width: 0;
    }

    .dot {
      min-width: 10px;
      min-height: 10px;
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: #b8afb9;
    }

    .dot[aria-current="true"] { background: var(--accent); }

    @media (max-width: 640px) {
      main { padding: 12px 10px 14px; gap: 10px; }
      header { padding-inline: 4px; }
      .card { max-height: calc(100vh - 126px); }
      .download { display: none; }
      .controls { gap: 8px; }
      .dots { gap: 5px; }
      .dot { min-width: 8px; min-height: 8px; width: 8px; height: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Sovereign Compute Access Act</h1>
      <div class="count" aria-live="polite"><span id="current">1</span> / 16</div>
    </header>

    <section class="stage" aria-label="Sovereign Compute Access Act carousel">
      <img id="card" class="card" src="card-01-the-act.png" alt="Card 1 of 16: The Sovereign Compute Access Act">
    </section>

    <nav class="controls" aria-label="Carousel controls">
      <button id="previous" type="button" aria-label="Previous card" title="Previous card">&#8592;</button>
      <div id="dots" class="dots" aria-label="Choose a card"></div>
      <div class="actions">
        <a id="download" class="download" href="card-01-the-act.png" download>Download card</a>
        <button id="next" type="button" aria-label="Next card" title="Next card">&#8594;</button>
      </div>
    </nav>
  </main>

  <script>
    const cards = [
      ["card-01-the-act.png", "The Sovereign Compute Access Act"],
      ["card-02-what-is-mandated.png", "What is mandated"],
      ["card-03-registry-principles.png", "Registry principles"],
      ["card-04-tier-1.png", "Tier I"],
      ["card-05-tier-2.png", "Tier II"],
      ["card-06-tier-3.png", "Tier III"],
      ["card-07-where-open-weights-are-not.png", "Where open weights are not"],
      ["card-08-hardware-neutrality.png", "Hardware neutrality"],
      ["card-09-section-106a-weights-in-the-die.png", "Proposed Section 106(a): weights in the die"],
      ["card-10-section-106b-encrypted-compute.png", "Proposed Section 106(b): encrypted compute"],
      ["card-11-section-106c-open-toolchain.png", "Proposed Section 106(c): open toolchain"],
      ["card-12-section-106d-open-os.png", "Proposed Section 106(d): open operating system"],
      ["card-13-section-106e-commitment-chain.png", "Proposed Section 106(e): commitment chain"],
      ["card-14-section-104-sovereign-node.png", "Section 104: Sovereign Node"],
      ["card-15-section-102b-reciprocity.png", "Section 102(b): reciprocity"],
      ["card-16-why-tier-1.png", "Why Tier I"]
    ];

    const image = document.getElementById("card");
    const current = document.getElementById("current");
    const download = document.getElementById("download");
    const dots = document.getElementById("dots");
    let active = 0;
    let touchStartX = 0;

    function show(index) {
      active = (index + cards.length) % cards.length;
      const [source, title] = cards[active];
      image.src = source;
      image.alt = `Card ${active + 1} of ${cards.length}: ${title}`;
      current.textContent = String(active + 1);
      download.href = source;
      for (const [dotIndex, dot] of [...dots.children].entries()) {
        dot.setAttribute("aria-current", String(dotIndex === active));
      }
      const next = cards[(active + 1) % cards.length][0];
      new Image().src = next;
    }

    cards.forEach(([, title], index) => {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.type = "button";
      dot.setAttribute("aria-label", `Show card ${index + 1}: ${title}`);
      dot.addEventListener("click", () => show(index));
      dots.appendChild(dot);
    });

    document.getElementById("previous").addEventListener("click", () => show(active - 1));
    document.getElementById("next").addEventListener("click", () => show(active + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(active - 1);
      if (event.key === "ArrowRight") show(active + 1);
    });
    image.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    image.addEventListener("touchend", (event) => {
      const distance = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(distance) > 45) show(active + (distance < 0 ? 1 : -1));
    }, { passive: true });

    show(0);
  </script>
</body>
</html>
