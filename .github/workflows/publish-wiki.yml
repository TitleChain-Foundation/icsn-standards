name: Publish governance Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki-source/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-governance-wiki
  cancel-in-progress: false

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Synchronize the GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git clone "$wiki_url" wiki-publication
          rsync -av --delete --exclude='.git/' wiki-source/ wiki-publication/
          cd wiki-publication
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Wiki already matches canonical source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish Wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
