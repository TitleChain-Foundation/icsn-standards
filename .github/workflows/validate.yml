name: Validate public standards repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install validation dependencies
        run: python3 -m pip install --requirement requirements-validation.txt
      - name: Validate JSON and internal Markdown links
        run: python3 scripts/validate_repository.py
      - name: Validate adopted M5 governance publication
        run: python3 scripts/validate_m5_governance.py
      - name: Validate hardware endpoint schemas and examples
        run: python3 tests/validate_hardware_endpoint_package.py
      - name: Validate Article 12 CER control schema and example
        run: python3 tests/validate_article12_cer_package.py
      - name: Validate Proof-of-Control snapshot, RFC 0002 and crosswalk
        run: python3 tests/validate_proof_of_control_profile.py
      - name: Validate M5-MATH-001 reference snapshot and vectors (Python and Node.js)
        run: python3 tests/validate_m5_math_reference.py
