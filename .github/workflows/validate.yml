name: Validate public standards repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate JSON and internal Markdown links
        run: python3 scripts/validate_repository.py
      - name: Validate adopted M5 governance publication
        run: python3 scripts/validate_m5_governance.py
