name: Get involved
description: Tell the public community how you would like to help. Do not submit private identity or credential data.
title: "Get involved: "
labels:
  - community
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for supporting the TitleChain Foundation public standards community.

        This is a **public GitHub issue**. Do not include private identity data, credentials, wallet addresses, confidential business information, private account details or information about another person. Submitting this form does not create Foundation membership, employment, compensation, an IAM/BOM account, a credential or governance authority.
  - type: dropdown
    id: path
    attributes:
      label: Participation path
      description: Choose the path that best fits your interest today.
      options:
        - Support, follow and learn
        - Review standards or research
        - Build software, hardware or infrastructure
        - Teach, mentor or design curriculum
        - Test accessibility, security or user experience
        - Contribute legal, governance, finance or market expertise
        - Support partnerships, communications or funding
        - Help operate the contributor community
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: What can you contribute?
      description: Share public, non-sensitive skills or experience. Examples include "I can build," "I can teach," "I can sell," "I can strategize," "I can form partnerships," "I can work across TradFi and DeFi," "I can contribute legal analysis," or "I can tinker and test."
      placeholder: I can...
    validations:
      required: true
  - type: dropdown
    id: focus
    attributes:
      label: Primary focus area
      options:
        - Identity, credentials and human authority
        - Sovereign knowledge, memory and graph-powered agents
        - Linux, M5POD/Solid, desktop or mobile engineering
        - Applied cryptography, privacy and security
        - Wallets, payments, ledgers and settlement
        - Registries, jurisdictions and legal entities
        - Ricardian contracts, digital assets and market infrastructure
        - Economics, indexes and real-world asset valuation
        - Governance, law, adjudication and public policy
        - Curriculum, instructors and cohort activation
        - Operations, partnerships, communications or funding
        - Other or cross-functional
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: What would you like to work on first?
      description: Name a public document, discussion, issue or deliverable if you already know.
  - type: dropdown
    id: availability
    attributes:
      label: Approximate availability
      options:
        - One-time review or introduction
        - A few hours per month
        - A few hours per week
        - Project or cohort based
        - Exploring; not ready to commit
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Public participation acknowledgements
      options:
        - label: I understand this issue and my GitHub username are public.
          required: true
        - label: I have not included private credentials, wallet information or confidential personal or business data.
          required: true
        - label: I understand that participation does not automatically create membership, employment, compensation, an M5 account or governance authority.
          required: true

