<circle cx="270.0" cy="235.5" r="3.4" fill="#d94a52"/>
<circle cx="430.0" cy="194.6" r="3.4" fill="#d94a52"/>
<circle cx="590.0" cy="153.6" r="3.4" fill="#d94a52"/>
<circle cx="750.0" cy="112.7" r="3.4" fill="#d94a52"/>
<path d="M110.0 315.7 L270.0 314.4 L430.0 313.3 L590.0 311.9 L750.0 310.9" fill="none" stroke="#7a9900" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="110.0" cy="315.7" r="3.4" fill="#7a9900"/>
<circle cx="270.0" cy="314.4" r="3.4" fill="#7a9900"/>
<circle cx="430.0" cy="313.3" r="3.4" fill="#7a9900"/>
<circle cx="590.0" cy="311.9" r="3.4" fill="#7a9900"/>
<circle cx="750.0" cy="310.9" r="3.4" fill="#7a9900"/>
<line x1="150" y1="132" x2="176" y2="132" stroke="#7a9900" stroke-width="2.8" stroke-linecap="round"/>
<text x="184" y="136" font-size="11.5" fill="#141414" text-anchor="start">inclusion proof (Merkle tree)</text>
<line x1="150" y1="152" x2="176" y2="152" stroke="#d94a52" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="184" y="156" font-size="11.5" fill="#141414" text-anchor="start">replay the whole chain</text>
<text x="740.0" y="102.68807825631868" font-size="10.5" fill="#6b665f" text-anchor="end">123 MB</text>
<text x="740.0" y="330.8908338781676" font-size="10.5" fill="#6b665f" text-anchor="end">1,771 B</text>
<text x="450" y="430" font-size="12" fill="#6b665f" text-anchor="middle">at 100,000 records the chain costs 123 MB and the proof costs 1.8 kB - a 69,000-fold difference</text>
<text x="450" y="450" font-size="11" fill="#a09a91" text-anchor="middle">the gap widens with every record added, because one line is linear and the other is logarithmic</text>
</svg>
