<text x="430.0" y="380" font-size="10.5" fill="#6b665f" text-anchor="middle">1,000</text>
<line x1="590.0" y1="104" x2="590.0" y2="362" stroke="#dcd6cd" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="590.0" y="380" font-size="10.5" fill="#6b665f" text-anchor="middle">10,000</text>
<line x1="750.0" y1="104" x2="750.0" y2="362" stroke="#dcd6cd" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="750.0" y="380" font-size="10.5" fill="#6b665f" text-anchor="middle">100,000</text>
<line x1="110" y1="362.0" x2="750" y2="362.0" stroke="#dcd6cd" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="100" y="366.0" font-size="10.5" fill="#6b665f" text-anchor="end">100 B</text>
<line x1="110" y1="280.1" x2="750" y2="280.1" stroke="#dcd6cd" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="100" y="284.10862662849047" font-size="10.5" fill="#6b665f" text-anchor="end">10 kB</text>
<line x1="110" y1="198.2" x2="750" y2="198.2" stroke="#dcd6cd" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="100" y="202.21725325698097" font-size="10.5" fill="#6b665f" text-anchor="end">1 MB</text>
<line x1="110" y1="116.3" x2="750" y2="116.3" stroke="#dcd6cd" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="100" y="120.3258798854715" font-size="10.5" fill="#6b665f" text-anchor="end">100 MB</text>
<text x="430.0" y="402" font-size="11.5" fill="#6b665f" text-anchor="middle">records in the log</text>
<text x="64" y="233.0" font-size="11.5" fill="#6b665f" text-anchor="middle" transform="rotate(-90 64 233.0)">bytes fetched to check one record</text>
<path d="M110.0 276.5 L270.0 235.5 L430.0 194.6 L590.0 153.6 L750.0 112.7" fill="none" stroke="#d94a52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
