<text x="80" y="186" font-size="12.5" fill="#3a4900" text-anchor="start" font-weight="700">read customer record ✓</text>
<rect x="366" y="156" width="286" height="50" rx="14" fill="url(#gTint)" stroke="#a9c920" stroke-width="1.5"/>
<text x="386" y="186" font-size="12.5" fill="#3a4900" text-anchor="start" font-weight="700">issue refund within limit ✓</text>
