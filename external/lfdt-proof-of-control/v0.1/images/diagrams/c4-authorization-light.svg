<g transform="translate(54,114) scale(0.7)" fill="none" stroke="#7a9900" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11 H18 V20 H6 Z"/><path d="M8.5 11 V8 A3.5 3.5 0 0 1 15.5 8 V11"/></g>
<text x="82" y="131" font-size="11" fill="#6b665f" text-anchor="start" font-weight="700" letter-spacing="1.2">GRANTED AUTHORITY — SCOPE · LIMITS · EXPIRY</text>
