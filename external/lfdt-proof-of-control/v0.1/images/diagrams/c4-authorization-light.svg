<text x="80" y="252" font-size="12.5" fill="#3a4900" text-anchor="start" font-weight="700">call registered tools ✓</text>
<text x="366" y="252" font-size="11" fill="#6b665f" text-anchor="start">every decision recorded</text>
<rect x="716" y="120" width="12" height="200" rx="6" fill="url(#gGate)" stroke="#0a0a0a" filter="url(#fGlow)"/>
<text x="722" y="342" font-size="11" fill="#6b665f" text-anchor="middle">interception gateway</text>
<line x1="680" y1="220" x2="710" y2="220" stroke="#8a857c" stroke-width="2" stroke-linecap="round"/>
<polygon points="711,220 701,214.5 701,225.5" fill="#8a857c"/>
<line x1="734" y1="170" x2="762" y2="170" stroke="#8a857c" stroke-width="2" stroke-linecap="round"/>
<polygon points="763,170 753,164.5 753,175.5" fill="#8a857c"/>
<rect x="768" y="138" width="238" height="62" rx="14" fill="url(#gTint)" stroke="#a9c920" stroke-width="1.5" filter="url(#fShadow)"/>
<text x="788" y="164" font-size="13" fill="#3a4900" text-anchor="start" font-weight="700">in-scope action</text>
<text x="788" y="184" font-size="12" fill="#3a4900" text-anchor="start">executes · recorded ✓</text>
<line x1="734" y1="268" x2="762" y2="268" stroke="#8a857c" stroke-width="2" stroke-linecap="round"/>
<polygon points="763,268 753,262.5 753,273.5" fill="#8a857c"/>
<rect x="768" y="238" width="238" height="62" rx="14" fill="url(#gRed)" stroke="#d94a52" stroke-width="1.5" filter="url(#fShadow)"/>
<text x="788" y="264" font-size="13" fill="#8c1119" text-anchor="start" font-weight="700">export database</text>
<text x="788" y="284" font-size="12" fill="#8c1119" text-anchor="start">✕ blocked + evidenced</text>
<text x="520.0" y="374" font-size="12.5" fill="#6b665f" text-anchor="middle">in-scope actions execute and are recorded; out-of-scope actions stop at the gateway — both leave evidence (C4.1)</text>
