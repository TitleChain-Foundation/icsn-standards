<text x="788" y="184" font-size="12" fill="#dfff5e" text-anchor="start">executes · recorded ✓</text>
<line x1="734" y1="268" x2="762" y2="268" stroke="#8d877e" stroke-width="2" stroke-linecap="round"/>
<polygon points="763,268 753,262.5 753,273.5" fill="#8d877e"/>
<rect x="768" y="238" width="238" height="62" rx="14" fill="url(#gRed)" stroke="#ff6568" stroke-width="1.5" filter="url(#fShadow)"/>
<text x="788" y="264" font-size="13" fill="#ffb3b5" text-anchor="start" font-weight="700">export database</text>
<text x="788" y="284" font-size="12" fill="#ffb3b5" text-anchor="start">✕ blocked + evidenced</text>
<text x="520.0" y="374" font-size="12.5" fill="#9d978e" text-anchor="middle">in-scope actions execute and are recorded; out-of-scope actions stop at the gateway — both leave evidence (C4.1)</text>
