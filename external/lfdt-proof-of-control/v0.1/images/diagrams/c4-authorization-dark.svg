<text x="80" y="252" font-size="12.5" fill="#dfff5e" text-anchor="start" font-weight="700">call registered tools ✓</text>
<text x="366" y="252" font-size="11" fill="#9d978e" text-anchor="start">every decision recorded</text>
<rect x="716" y="120" width="12" height="200" rx="6" fill="url(#gGate)" stroke="#cfff04" filter="url(#fGlow)"/>
