<g transform="translate(140,574) scale(0.75)" fill="none" stroke="#1a2000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 C6 7 18 7 21 12 C18 17 6 17 3 12 Z"/><path d="M12 12 m-2.4 0 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0"/></g>
<text x="170" y="592" font-size="15" fill="#1a2000" text-anchor="start" font-weight="700">Verifier</text>
