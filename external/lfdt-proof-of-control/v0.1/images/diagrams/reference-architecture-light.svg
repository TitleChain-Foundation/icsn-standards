<text x="174" y="336" font-size="15" fill="#f0edea" text-anchor="start" font-weight="700">Hardware TEE enclave</text>
<rect x="146" y="356" width="508" height="34" rx="8" fill="url(#gCard)" stroke="#dcd6cd" stroke-width="1.5"/>
<text x="164" y="378" font-size="11.5" fill="#141414" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">1  verify signed Rego policy bundle</text>
