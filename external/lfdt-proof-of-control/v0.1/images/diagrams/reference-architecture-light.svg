<text x="164" y="420" font-size="11.5" fill="#141414" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">2  evaluate snapshot → ALLOW · DENY · MODIFY · ESCALATE</text>
<rect x="146" y="440" width="508" height="34" rx="8" fill="url(#gCard)" stroke="#dcd6cd" stroke-width="1.5"/>
<text x="164" y="462" font-size="11.5" fill="#141414" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">3  append signed Merkle leaf  L_t = H(L_t-1 || H(snap) || verdict)</text>
<rect x="146" y="482" width="508" height="34" rx="8" fill="url(#gCard)" stroke="#dcd6cd" stroke-width="1.5"/>
<text x="164" y="504" font-size="11.5" fill="#141414" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">4  sign Entity Attestation Token (EAT / CWT)</text>
