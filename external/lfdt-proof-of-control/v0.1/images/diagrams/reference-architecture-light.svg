<text x="550" y="592" font-size="15" fill="#141414" text-anchor="start" font-weight="700">Relying party</text>
<text x="520" y="620" font-size="11.5" fill="#6b665f" text-anchor="start">API gateway or service — requires a valid</text>
<text x="520" y="637" font-size="11.5" fill="#6b665f" text-anchor="start">result before executing the tool request</text>
<line x1="444" y1="614" x2="496" y2="614" stroke="#8a857c" stroke-width="2" stroke-linecap="round"/>
<polygon points="497,614 487,608.5 487,619.5" fill="#8a857c"/>
<rect x="922.8" y="572" width="83.2" height="24" rx="12" fill="url(#gWarm)" stroke="#c6bfb4" stroke-width="1.5"/>
<text x="964.4" y="588" font-size="9.5" fill="#4a463f" text-anchor="middle" font-weight="700" letter-spacing="1.1">VERIFIER</text>
<rect x="885.8" y="604" width="120.2" height="24" rx="12" fill="url(#gWarm)" stroke="#c6bfb4" stroke-width="1.5"/>
<text x="945.9" y="620" font-size="9.5" fill="#4a463f" text-anchor="middle" font-weight="700" letter-spacing="1.1">RELYING PARTY</text>
<text x="520.0" y="734" font-size="12.5" fill="#6b665f" text-anchor="middle">policy evaluation, evidence signing, and history live inside the enclave — the operator can run the agent, but cannot forge its record</text>
