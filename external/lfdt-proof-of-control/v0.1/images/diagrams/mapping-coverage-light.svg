<text x="34" y="42" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#7a9900">REGULATORY COVERAGE</text>
<text x="34" y="70" font-size="19" font-weight="700" letter-spacing="-0.2" fill="#141414">How much of Proof-of-Control each framework already addresses</text>
